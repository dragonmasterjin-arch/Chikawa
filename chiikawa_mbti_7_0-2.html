const chars=[{"type":"ISTJ","name":"랏코","icon":"🦦","quote":"꾸준한 노력으로 실력을 증명하는 선배","desc":"훈련과 책임을 중요하게 여겨. 강한 모습 뒤에는 자기만의 성실한 습관이 있어.","tags":["성실함","책임감","실력파"]},{"type":"ISFJ","name":"시사","icon":"🦁","quote":"천천히라도 끝까지 해낼 거야!","desc":"배움을 포기하지 않고 주변 사람에게 예의 바르게 다가가. 따뜻하고 성실한 편이야.","tags":["성실함","다정함","끈기"]},{"type":"INFJ","name":"아노코","icon":"🦊","quote":"조용한 모습 뒤에 복잡한 마음","desc":"쉽게 속마음을 드러내지 않아. 남들이 이해하기 어려운 내면과 섬세한 감정을 가졌다는 상상에서 배정했어.","tags":["신비로움","내면","감수성"]},{"type":"ESFP","name":"모몽가","icon":"🐿️","quote":"지금 이 순간 주목받고 싶어!","desc":"관심을 끌 줄 알고 감정 표현도 화려해. 눈앞의 재미와 반응에 빠르게 움직여.","tags":["표현력","즉흥성","존재감"]},{"type":"ESTP","name":"우사기","icon":"🐰","quote":"우라! 일단 해보고 생각하자!","desc":"위험 앞에서도 겁보다 호기심이 먼저 나와. 즉흥적이고 행동이 빠른 모험가야.","tags":["행동파","대담함","즉흥성"]},{"type":"ENFP","name":"하치와레","icon":"🐱","quote":"새로운 발견을 친구와 나누고 싶어!","desc":"낙관적이고 호기심이 많아. 어려운 상황에서도 희망과 새로운 가능성을 찾아.","tags":["낙천적","호기심","친화력"]},{"type":"ISTP","name":"쿠리만쥬","icon":"🌰","quote":"조용히 내 방식대로 즐길래","desc":"말을 많이 하기보다 행동과 취향으로 표현해. 남의 시선보다 자기만의 리듬을 중시해.","tags":["독립적","침착함","취향 확고"]},{"type":"ENTP","name":"고블린","icon":"👺","quote":"예측 못 할 장난이 더 재밌어!","desc":"틀에 박힌 것보다 엉뚱한 선택과 자극을 즐기는 모습으로 상상해 봤어.","tags":["변칙적","호기심","장난기"]},{"type":"INTJ","name":"세이렌","icon":"🧜","quote":"아름다운 노래 뒤에 숨은 계획","desc":"자신의 목적을 향해 고집 있게 움직이고 전체 상황을 자신만의 방식으로 조율하는 유형으로 해석했어.","tags":["목적지향","독립성","계획성"]},{"type":"ISFP","name":"섬아저씨","icon":"🏝️","quote":"내 공간에서 느긋한 하루","desc":"자연스럽고 편안한 일상을 좋아해. 큰 소란보다 자기가 좋아하는 것을 묵묵히 즐겨.","tags":["평온함","자유로움","감각적"]},{"type":"ESTJ","name":"갑옷아저씨","icon":"🛡️","quote":"맡은 일은 확실하게 처리한다","desc":"일을 책임감 있게 정리하고 정해진 역할을 지켜. 필요할 때는 질서 있게 행동해.","tags":["책임감","질서","실행력"]},{"type":"INFP","name":"치이카와","icon":"🐻","quote":"무서워도 소중한 마음은 지킬래","desc":"겁이 나도 친구를 아끼고 마음속 바람을 잃지 않아. 여리고 공감이 깊은 성장형이야.","tags":["공감력","순수함","용기"]},{"type":"ESFJ","name":"카니","icon":"🦀","quote":"친구와 함께하는 시간이 좋아","desc":"친구를 세심하게 챙기고 함께하는 일에서 즐거움을 느껴. 다정한 관계가 큰 힘이야.","tags":["친화력","배려","따뜻함"]},{"type":"ENTJ","name":"키메라","icon":"🐉","quote":"강한 의지로 내 길을 간다","desc":"강렬한 에너지와 주도적인 면을 중심으로 상상한 유형이야. 실제 설정과 다를 수 있어.","tags":["주도적","강렬함","결단력"]},{"type":"INTP","name":"풍뎅이","icon":"🪲","quote":"이건 대체 어떻게 된 걸까?","desc":"알 수 없는 세상을 자기 방식으로 탐구하는 조용한 호기심의 상징으로 해석했어.","tags":["탐구심","독창성","관찰력"]},{"type":"ENFJ","name":"오데","icon":"🍢","quote":"우리 함께라면 든든해","desc":"함께하는 친구를 소중히 여기고 서로 돕는 마음에 가치를 두는 모습으로 해석했어.","tags":["유대감","배려","따뜻함"]}];

['🍄','2장 · 숲의 입구 · 숲길에는 처음 보는 빛나는 버섯이 있다.',[['색과 형태를 자세히 관찰한다','S'],['왜 빛나는지 여러 가설을 떠올린다','N'],['친구들을 불러 함께 본다','E'],['조용히 혼자 조사한다','I']]],
['🌲','2장 · 이상한 소리 · 나무 뒤에서 사각거리는 소리가 난다.',[['안전을 위해 동선을 미리 정한다','J'],['상황을 보며 움직일 준비를 한다','P'],['어떤 생물인지 단서부터 찾는다','T'],['무서워하는 동료를 먼저 달랜다','F']]],
['🐰','2장 · 우사기의 지름길 · 우사기가 갑자기 낯선 샛길로 뛰어간다.',[['함께 달려 새로운 길을 확인한다','P'],['원래 정한 길을 유지하자고 한다','J'],['지름길이 정말 이어질지 추측한다','N'],['주변 발자국을 확인해 판단한다','S']]],

function face(ch){let colors={'랏코':'#d2b395','시사':'#f7d9a5','아노코':'#efbed8','모몽가':'#e3e4ef','우사기':'#fff0b6','하치와레':'#d9eafd','쿠리만쥬':'#e8ca9a','고블린':'#c4dca1','세이렌':'#d9c9f2','섬아저씨':'#b9e5da','갑옷아저씨':'#cbd0d8','치이카와':'#f7f4ed','카니':'#ffd4c6','키메라':'#d4c6e9','풍뎅이':'#b7d9aa','오데':'#f8dfbd'};const photo=photoFaces[ch.name];return `<span class="face" style="background:${colors[ch.name]||'#fff0d8'}" aria-label="${ch.name}">${photo?`<img src="${photo}" alt="${ch.name} 얼굴">`:ch.icon}</span>`;}
const app=document.getElementById('app');let answers=[];let screen='start';
function counts(){let c={E:0,I:0,N:0,S:0,T:0,F:0,J:0,P:0};answers.forEach((a,i)=>{if(a!==undefined)c[questions[i][2][a][1]]++});return c}
function calc(){const c=counts();const dim=[['E','I'],['S','N'],['T','F'],['J','P']];let t=dim.map(([a,b])=>c[a]>=c[b]?a:b).join('');let ranked=chars.map(x=>{let score=0;for(let k=0;k<4;k++){let v=x.type[k],own=c[v],other=c[dim[k].find(z=>z!==v)];score+=(own-other);if(v===t[k])score+=0.2}return {...x,score}}).sort((a,b)=>b.score-a.score);return {type:t,char:chars.find(x=>x.type===t)||ranked[0],ranked,c};}

const insights={
E:['함께할 때 에너지가 커지는 편','너무 많은 약속에 지치지 않도록 쉬는 시간도 챙겨봐'],I:['혼자 관찰하고 생각을 정리하는 편','필요한 순간에는 생각을 말로 꺼내도 좋아'],
S:['눈앞의 단서와 경험을 잘 활용해','익숙한 답 외의 가능성도 가끔 열어 둬'],N:['보이지 않는 가능성과 의미를 잘 발견해','상상한 아이디어를 작은 실험으로 확인해 봐'],
T:['문제를 분석하고 기준을 세우는 데 강해','해답뿐 아니라 상대의 마음도 물어봐'],F:['사람의 기분과 관계를 세심하게 느껴','모두를 챙기느라 네 마음을 미루지 마'],
J:['계획을 세워 불안을 줄이고 완성도를 높여','계획이 바뀌어도 실패라고 생각하지 마'],P:['변화에 잘 적응하고 순간의 기회를 잡아','중요한 약속은 작은 메모로 남겨봐']};
function compatibility(current,kind){const scored=chars.filter(x=>x.name!==current.name).map(x=>{let same=[0,1,2,3].filter(i=>x.type[i]===current.type[i]).length;let complement=(x.type[1]===current.type[1]?1:0)+(x.type[2]!==current.type[2]?1:0)+(x.type[3]!==current.type[3]?1:0);return {x,same,complement};});
if(kind==='good')scored.sort((a,b)=>(b.same+b.complement*.32)-(a.same+a.complement*.32));else scored.sort((a,b)=>a.same-b.same);return scored[0].x;}
function matchReason(a,b,kind){return kind==='good'?(a.type[2]===b.type[2]?'중요하게 여기는 판단 기준이 비슷해서 서로 이해하기 쉬워.':'다른 판단 방식을 나누면서 서로를 보완할 수 있어.'):(a.type[0]!==b.type[0]?'사람들과 어울리는 속도가 달라서 서로의 휴식 시간을 존중하면 좋아.':'계획과 의사결정 방식이 달라 작은 오해가 생길 수 있어.');}
function resultExtra(d,r){const good=compatibility(d,'good'),different=compatibility(d,'different');return `<div class="sectiontitle">📜 너의 모험 성격 보고서</div><p class="desc">20개의 선택을 바탕으로 <b>${d.name}</b>과 닮은 네 성향을 분석했어. 같은 MBTI라도 각자 모습은 다를 수 있어.</p><div class="storypanel"><b>✨ 이런 점이 장점이야</b><p>${[...d.type].map(t=>insights[t][0]).join('. ')}.</p></div><div class="storypanel"><b>🌱 이런 점을 조심해 봐</b><p>${[...d.type].map(t=>insights[t][1]).slice(0,2).join(' ')}</p></div><div class="storypanel"><b>🧭 모험 속 너의 선택</b><p>모험에서 ${r.c.F>r.c.T?'친구의 마음을 먼저 살핀':'문제의 원인을 먼저 분석한'} 순간이 많았고, ${r.c.J>r.c.P?'계획을 세우는':'상황에 맞춰 움직이는'} 방식이 조금 더 두드러졌어.</p></div><div class="sectiontitle">💕 캐릭터 궁합</div><div class="compat"><span>${face(good)}</span><div><b>함께 모험하기 좋은 친구 · ${good.name}</b><small>${good.type}</small><p>${matchReason(d,good,'good')}</p></div></div><div class="compat"><span>${face(different)}</span><div><b>서로 이해가 필요한 친구 · ${different.name}</b><small>${different.type}</small><p>${matchReason(d,different,'different')} 궁합이 나쁘다는 뜻은 아니야.</p></div></div><p class="smallnote">궁합은 MBTI 글자의 유사성과 차이를 활용한 놀이용 해석으로, 실제 인간관계를 예측하지 않아.</p>`;}

function render(){if(screen==='start'){app.innerHTML=`<section class="card hero"><div class="mascot">${face(chars.find(x=>x.name==='시사'))} ${face(chars.find(x=>x.name==='카니'))} ${face(chars.find(x=>x.name==='풍뎅이'))}</div><div class="eyebrow">WHO ARE YOU IN CHIIKAWA WORLD?</div><h1>치이카와 세계에서<br>나는 누구일까?</h1><p class="sub">씩씩한 랏코부터 예측 불가 우사기,<br>신비로운 세이렌과 다정한 오데까지!<br>숲에서 시작해 신비한 섬까지!<br>20개의 선택으로 하나의 모험을 완성해 보자.</p><div class="pillline"><span class="pill">📖 5장으로 이어지는 20개 선택</span><span class="pill">🎭 결과 16종</span><span class="pill">👾 괴물 포함</span></div><button class="mainbtn" onclick="start()">탐험 시작하기 ✨</button><p class="smallnote">로그인 없이 플레이 · 결과 자동 저장 · 모바일 지원</p></section>`;return}if(screen==='quiz'){let i=answers.length,q=questions[i];app.innerHTML=`<div class="progressrow"><span>🌿 모험 진행 중</span><span>${i+1} / ${questions.length}</span></div><div class="bar"><div class="barinner" style="width:${i/questions.length*100}%"></div></div><section class="card"><div class="scene">${q[0]}</div><div class="chapter">${q[1].split(" · ")[0]}</div><div class="stepLabel">SCENE ${String(i+1).padStart(2,'0')} · ${i<4?"의뢰와 출발":i<8?"숲길 탐험":i<12?"수상한 동굴":i<16?"섬의 만남":"귀환과 결말"}</div><h2 class="question">${q[1].split(" · ").slice(1).join(" · ")}</h2><div class="choices">${q[2].map((x,j)=>`<button class="choice" onclick="choose(${j})"><i>${'ABCD'[j]}</i><span>${x[0]}</span></button>`).join('')}</div><div class="nav"><button class="secondary" onclick="back()" ${i===0?'disabled':''}>← 이전 질문</button></div></section>`;return}if(screen==='result'){const r=calc(),d=r.char,c=r.c;let axes=[['E','I','외향','내향'],['S','N','현실','직관'],['T','F','논리','감정'],['J','P','계획','즉흥']];app.innerHTML=`<section class="card"><div class="eyebrow" style="text-align:center">YOUR CHIIKAWA CHARACTER</div><div class="resultIcon">${face(d)}</div><div class="type">${r.type} · 비공식 해석</div><div class="name">${d.name}</div><div class="quote">“${d.quote}”</div><p class="desc">${d.desc}</p><div class="traits">${d.tags.map(x=>`<span># ${x}</span>`).join('')}</div><div class="sectiontitle">🔎 네 선택에서 드러난 성향</div>${axes.map(([a,b,an,bn])=>{let val=c[a]+c[b]||1;let percent=Math.round(c[a]/val*100);return `<div class="meter"><div class="meterlabel"><span>${an} ${a} · ${percent}%</span><span>${100-percent}% · ${b} ${bn}</span></div><div class="metertrack"><div class="meterfill" style="width:${percent}%"></div></div></div>`}).join('')}${resultExtra(d,r)}<div class="sectiontitle">🌟 다른 세계의 나와 닮은 캐릭터</div>${r.ranked.filter(x=>x.name!==d.name).slice(0,3).map(x=>`<div class="match"><span class="matchicon">${face(x)}</span><span>${x.name}<small>${x.type}</small></span><strong>후보</strong></div>`).join('')}<div class="nav"><button class="mainbtn" onclick="share()">결과 공유하기 ↗</button><button class="secondary" onclick="restart()">다시하기</button></div><div class="sectiontitle">📚 16가지 결과 캐릭터</div><div class="gridtypes">${chars.map(x=>`<div class="typechip" title="${x.name}"><b>${face(x)}</b><span>${x.name}</span><small>${x.type}</small></div>`).join('')}</div><p class="smallnote">동일한 점수가 나오면 선택지에 따른 우세 성향으로 결정해. 이 캐릭터의 MBTI는 공식 설정이 아니야.</p></section>`;return}}
function start(){answers=[];screen='quiz';save();render();scrollTo(0,0)}function choose(j){answers.push(j);if(answers.length===questions.length)screen='result';save();render();scrollTo(0,0)}function back(){if(answers.length){answers.pop();save();render()}}function restart(){if(!confirm('처음부터 다시 시작할까?'))return;answers=[];screen='start';save();render();scrollTo(0,0)}function save(){try{localStorage.setItem('chiikawa-personality-v1',JSON.stringify({answers,screen}))}catch(e){}}function share(){let r=calc();let msg=`나는 치이카와 세계에서 ${r.char.name}! (${r.type})\n${r.char.quote}\n치이카와 성격 탐험`;if(navigator.share){navigator.share({title:'치이카와 성격 탐험',text:msg,url:location.href}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(msg+'\n'+location.href).then(()=>alert('결과를 복사했어!')).catch(()=>prompt('결과를 복사해 줘',msg))}else prompt('결과를 복사해 줘',msg)}try{let o=JSON.parse(localStorage.getItem('chiikawa-personality-v1'));if(o&&Array.isArray(o.answers)&&o.answers.length<=questions.length&&o.answers.every((v,i)=>Number.isInteger(v)&&v>=0&&v<questions[i][2].length)){answers=o.answers;screen=answers.length===questions.length?'result':answers.length?'quiz':'start'}}catch(e){}render();
</script></body></html>
